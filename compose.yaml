services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_DB: mini-crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "mini-crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: 1234
      DB_NAME: mini-crm
      JWT_SECRET: super-secret-jwt-key-mini-crm-development-2026
      CORS_ORIGIN: http://localhost:3001
      CLIENT_REDIRECT_URL: http://localhost:3001/dashboard
      oauth2Endpoint: https://accounts.google.com/o/oauth2/v2/auth
      GOOGLE_CALLBACK_URL: http://localhost:3000/auth/google/callback
    env_file:
      - path: ./server/.env
        required: false
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    restart: always
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - server

volumes:
  postgres_data:
